version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: banana_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banana_db
      MYSQL_USER: banana_user
      MYSQL_PASSWORD: banana_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - banana_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: banana_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - banana_network

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banana_laravel
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - banana_network

networks:
  banana_network:
    driver: bridge

volumes:
  mysql_data: